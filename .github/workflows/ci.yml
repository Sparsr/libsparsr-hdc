name: CI

# Builds the library against an unpacked Sparsr SDK and runs its harness on the Sparsr VM,
# then builds the MNIST example and checks it reports missing data correctly.
#
# The SDK is fetched from a Sparsr release with a read-only token. A pull request from a
# fork has no access to that token, so it cannot run the full check; a maintainer pushes
# the branch to this repository to run it. See CONTRIBUTING.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # SPARSR_GITHUB_RELEASES_REPO, a repository variable, names the GitHub repository whose
  # GitHub Releases carry the Sparsr tarballs; SPARSR_GITHUB_RELEASES_TOKEN, a repository
  # secret, is a read-only token for that repository.
  # The tag of the GitHub release the SDK is taken from. Pinned so that an SDK change cannot break a
  # library change that touched nothing; bump it on purpose.
  SPARSR_SDK_GITHUB_RELEASE_TAG: nightly-20260916-065931-35066187573-1

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install the RISC-V bare-metal toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-riscv64-unknown-elf gcc-riscv64-unknown-elf

      - name: Fetch the Sparsr SDK
        env:
          GH_TOKEN: ${{ secrets.SPARSR_GITHUB_RELEASES_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "No SPARSR_GITHUB_RELEASES_TOKEN is available to this run, so the SDK cannot be fetched."
            echo "That is expected for a pull request from a fork: a maintainer runs the full check"
            echo "by pushing the branch to this repository. See CONTRIBUTING.md."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/sdk"
          gh release download "$SPARSR_SDK_GITHUB_RELEASE_TAG" --repo "${{ vars.SPARSR_GITHUB_RELEASES_REPO }}" --pattern 'sparsr-sdk-*.tar.gz' --dir "$RUNNER_TEMP"
          tar xzf "$RUNNER_TEMP"/sparsr-sdk-*.tar.gz -C "$RUNNER_TEMP/sdk" --strip-components=1
          echo "SPARSR_SDK_ROOT=$RUNNER_TEMP/sdk" >> "$GITHUB_ENV"

      - name: Build the library
        run: make all

      - name: Run the harness on the Sparsr VM
        run: |
          set -o pipefail
          make test 2>&1 | tee test-output.txt
          grep -q "TEST PASSED" test-output.txt

      - name: Build the MNIST example and check it reports missing data
        run: make -C examples/mnist check
